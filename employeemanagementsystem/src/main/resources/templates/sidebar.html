<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --secondary:#7c3aed;
}

.sidebar{

    position:fixed;

    top:0;
    left:0;

    width:280px;
    height:100vh;

    background:
    linear-gradient(
        180deg,
        rgba(37,99,235,.95),
        rgba(124,58,237,.95)
    );

    backdrop-filter:blur(20px);

    color:white;

    padding:25px;

    box-shadow:
    10px 0 40px rgba(0,0,0,.15);

    z-index:1000;
}

.logo-section{

    display:flex;
    align-items:center;

    gap:15px;

    padding-bottom:25px;

    border-bottom:
    1px solid rgba(255,255,255,.15);
}

.logo-icon{

    width:55px;
    height:55px;

    border-radius:15px;

    background:white;

    color:#2563eb;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
}

.logo-title{
    font-size:22px;
    font-weight:700;
}

.profile-card{

    margin-top:30px;

    background:
    rgba(255,255,255,.12);

    border-radius:20px;

    padding:20px;

    text-align:center;
}

.profile-avatar{

    width:75px;
    height:75px;

    border-radius:50%;

    background:white;

    color:#2563eb;

    font-size:28px;
    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;
}

.profile-name{
    margin-top:15px;
    font-weight:600;
}

.profile-role{
    opacity:.8;
    font-size:14px;
}

.sidebar-menu{

    margin-top:35px;
}

.sidebar-menu a{

    display:flex;
    align-items:center;

    gap:15px;

    text-decoration:none;

    color:white;

    padding:14px 18px;

    border-radius:15px;

    margin-bottom:10px;

    transition:.3s;
}

.sidebar-menu a:hover{

    background:
    rgba(255,255,255,.18);

    transform:
    translateX(6px);
}

.sidebar-menu a.active{

    background:white;

    color:#2563eb;

    font-weight:600;
}

.sidebar-footer{

    position:absolute;

    bottom:30px;

    left:25px;

    right:25px;
}

.logout-btn{

    width:100%;

    border:none;

    border-radius:15px;

    padding:12px;

    font-weight:600;

    background:white;

    color:#2563eb;
}

.main-content{

    margin-left:300px;

    padding:30px;
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo-section">

        <div class="logo-icon">

            <i class="fas fa-users-cog"></i>

        </div>

        <div>

            <div class="logo-title">
                EMS Pro
            </div>

            <small>
                HR Management
            </small>

        </div>

    </div>

    <div class="profile-card">

        <div class="profile-avatar">

            A

        </div>

        <div class="profile-name">

            Admin User

        </div>

        <div class="profile-role">

            HR Administrator

        </div>

    </div>

    <div class="sidebar-menu">

        <a href="/" class="active">

            <i class="fas fa-chart-pie"></i>

            Dashboard

        </a>

        <a th:href="@{/employee/list}">

            <i class="fas fa-users"></i>

            Employees

        </a>

        <a th:href="@{/employee/add}">

            <i class="fas fa-user-plus"></i>

            Add Employee

        </a>

        <a href="#">

            <i class="fas fa-chart-line"></i>

            Reports

        </a>

        <a href="#">

            <i class="fas fa-gear"></i>

            Settings

        </a>

    </div>

    <div class="sidebar-footer">

        <button class="logout-btn">

            <i class="fas fa-sign-out-alt"></i>
            Logout

        </button>

    </div>

</div>

<div class="main-content">

    <!-- Page Content Here -->

</div>

</body>
</html>
