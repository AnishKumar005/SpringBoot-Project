<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Employee | EMS Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --secondary:#7c3aed;
    --success:#10b981;
    --danger:#ef4444;
}

body{
    min-height:100vh;
    background:
    linear-gradient(
        135deg,
        #dbeafe 0%,
        #eef2ff 50%,
        #f5d0fe 100%
    );
    font-family:'Segoe UI',sans-serif;
}

.page-header{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    color:white;
    border-radius:30px;
    padding:35px;
    margin-top:25px;
    margin-bottom:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.glass-card{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.35);
    border-radius:30px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.profile-summary{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    color:white;
    border-radius:25px;
    padding:25px;
    margin-bottom:30px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:white;
    color:#2563eb;
    font-size:36px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}

.form-floating{
    margin-bottom:22px;
}

.form-control,
.form-select{
    border-radius:16px;
    border:1px solid #dbeafe;
    height:60px;
}

.form-control:focus,
.form-select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 .25rem rgba(37,99,235,.15);
}

.btn-update{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    border:none;
    color:white;
    border-radius:15px;
    padding:14px 35px;
    font-weight:700;
}

.btn-update:hover{
    transform:translateY(-3px);
}

.btn-back{
    border-radius:15px;
    padding:14px 35px;
    font-weight:600;
}

.error-text{
    color:#dc2626;
    font-size:14px;
    margin-top:-10px;
    margin-bottom:12px;
}

.section-title{
    font-weight:700;
    margin-bottom:25px;
}

.info-box{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    border-radius:15px;
    padding:18px;
    margin-bottom:25px;
}

</style>

</head>

<body>

<div class="container py-4">

    <div class="page-header">

        <div class="row align-items-center">

            <div class="col-md-8">

                <h1 class="fw-bold">

                    <i class="fas fa-user-pen"></i>
                    Edit Employee Profile

                </h1>

                <p class="mb-0">

                    Update employee information and maintain workforce records.

                </p>

            </div>

            <div class="col-md-4 text-end">

                <a th:href="@{/employee/list}"
                   class="btn btn-light btn-lg">

                    <i class="fas fa-arrow-left"></i>
                    Back

                </a>

            </div>

        </div>

    </div>

    <div class="glass-card">

        <div class="profile-summary">

            <div class="d-flex align-items-center">

                <div class="avatar me-4"
                     th:text="${#strings.substring(employee.employeeName,0,1)}">
                </div>

                <div>

                    <h3 class="fw-bold mb-1"
                        th:text="${employee.employeeName}">
                    </h3>

                    <h6 class="mb-1"
                        th:text="${employee.designation}">
                    </h6>

                    <span th:text="${employee.department}">
                    </span>

                </div>

            </div>

        </div>

        <div class="info-box">

            <strong>
                Employee Update Form
            </strong>

            <br>

            Modify employee details and save changes securely.

        </div>

        <h3 class="section-title">

            <i class="fas fa-id-card"></i>
            Employee Information

        </h3>

        <form th:action="@{/employee/update}"
              th:object="${employee}"
              method="post">

            <input type="hidden"
                   th:field="*{employeeId}">

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{employeeName}"
                               class="form-control"
                               placeholder="Employee Name">

                        <label>
                            Employee Name
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('employeeName')}"
                         th:errors="*{employeeName}">
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Email">

                        <label>
                            Email Address
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{phone}"
                               class="form-control"
                               placeholder="Phone">

                        <label>
                            Mobile Number
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}">
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-floating">

                        <select th:field="*{department}"
                                class="form-select">

                            <option value="">Select Department</option>
                            <option value="HR">HR</option>
                            <option value="IT">IT</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Operations">Operations</option>
                            <option value="Sales">Sales</option>

                        </select>

                        <label>
                            Department
                        </label>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{designation}"
                               class="form-control"
                               placeholder="Designation">

                        <label>
                            Designation
                        </label>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="number"
                               step="0.01"
                               th:field="*{salary}"
                               class="form-control"
                               placeholder="Salary">

                        <label>
                            Salary
                        </label>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="date"
                               th:field="*{joiningDate}"
                               class="form-control">

                        <label>
                            Joining Date
                        </label>

                    </div>

                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-3">

                <button type="submit"
                        class="btn btn-update">

                    <i class="fas fa-floppy-disk"></i>
                    Update Employee

                </button>

                <a th:href="@{/employee/list}"
                   class="btn btn-outline-secondary btn-back">

                    <i class="fas fa-arrow-left"></i>
                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
