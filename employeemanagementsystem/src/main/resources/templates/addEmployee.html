<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Employee | EMS Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --secondary:#7c3aed;
    --success:#10b981;
    --light:#f8fafc;
    --dark:#0f172a;
}

body{
    min-height:100vh;
    background:
    linear-gradient(
        135deg,
        #dbeafe 0%,
        #e0e7ff 50%,
        #f5d0fe 100%
    );
    font-family:'Segoe UI',sans-serif;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    background:#0f172a;
    padding:30px 20px;
    z-index:1000;
}

.sidebar-logo{
    color:white;
    font-size:24px;
    font-weight:700;
    margin-bottom:40px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#cbd5e1;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

.sidebar a:hover{
    background:#1e293b;
    color:white;
}

.main-content{
    margin-left:260px;
}

.page-header{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    color:white;
    border-radius:30px;
    padding:35px;
    margin-bottom:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.glass-card{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.4);
    border-radius:30px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.form-floating{
    margin-bottom:22px;
}

.form-control,
.form-select{
    border-radius:16px;
    border:1px solid #dbeafe;
    height:60px;
}

.form-control:focus,
.form-select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 .25rem rgba(37,99,235,.15);
}

.form-floating label{
    color:#64748b;
}

.section-title{
    font-weight:700;
    color:#0f172a;
}

.info-box{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    padding:18px;
    border-radius:15px;
    margin-bottom:30px;
}

.btn-save{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    border:none;
    color:white;
    border-radius:15px;
    padding:14px 35px;
    font-weight:700;
}

.btn-save:hover{
    transform:translateY(-3px);
}

.btn-back{
    border-radius:15px;
    padding:14px 35px;
    font-weight:600;
}

.icon-circle{
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

.error-text{
    color:#dc2626;
    font-size:14px;
    margin-top:-12px;
    margin-bottom:12px;
}

.required{
    color:#dc2626;
}

.stats-card{
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.06);
}

</style>

</head>

<body>
	
	<body>

	<div class="sidebar">

	    <div class="sidebar-logo">
	        <i class="fas fa-users-cog"></i>
	        EMS Pro
	    </div>

	    <a th:href="@{/employee/}">
	        <i class="fas fa-home"></i>
	        Dashboard
	    </a>

	    <a th:href="@{/employee/list}">
	        <i class="fas fa-users"></i>
	        View Employees
	    </a>

	    <a th:href="@{/employee/add}">
	        <i class="fas fa-user-plus"></i>
	        Add Employee
	    </a>

	    <a th:href="@{/employee/analytics}">
	        <i class="fas fa-chart-line"></i>
	        Analytics
	    </a>

	</div>

	<div class="main-content">

<div class="container-fluid py-4 px-5">

    <div class="page-header">

        <div class="row align-items-center">

            <div class="col-md-8">

                <h1 class="fw-bold">
                    <i class="fas fa-user-plus"></i>
                    Add New Employee
                </h1>

                <p class="mb-0 fs-5">
                    Register employees and maintain workforce information securely.
                </p>

            </div>

            <div class="col-md-4 text-end">

                <div class="d-inline-flex icon-circle">
                    <i class="fas fa-users"></i>
                </div>

            </div>

        </div>

    </div>

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="stats-card">
                <i class="fas fa-user-check fa-2x text-primary"></i>
                <h5 class="mt-2">Employee Registration</h5>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stats-card">
                <i class="fas fa-shield-alt fa-2x text-success"></i>
                <h5 class="mt-2">Secure Records</h5>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stats-card">
                <i class="fas fa-building fa-2x text-warning"></i>
                <h5 class="mt-2">Department Mapping</h5>
            </div>
        </div>

    </div>

    <div class="glass-card">

        <div class="info-box">

            <strong>
                Employee Information
            </strong>

            <br>

            All fields marked with
            <span class="required">*</span>
            are mandatory.

        </div>

        <h3 class="section-title mb-4">

            <i class="fas fa-id-card"></i>
            Employee Registration Form

        </h3>

        <form th:action="@{/employee/save}"
              th:object="${employee}"
              method="post">

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{employeeName}"
                               class="form-control"
                               placeholder="Employee Name">

                        <label>
                            Employee Name *
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('employeeName')}"
                         th:errors="*{employeeName}">
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Email">

                        <label>
                            Email Address *
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{phone}"
                               class="form-control"
                               placeholder="Phone">

                        <label>
                            Mobile Number *
                        </label>

                    </div>

                    <div class="error-text"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}">
                    </div>

                </div>

                <div class="col-md-6">

					<div class="form-floating">

					    <select th:field="*{department}"
					            class="form-select">

					        <option value="">Select Department</option>

					        <option value="HR">HR</option>
					        <option value="Finance">Finance</option>
					        <option value="IT">IT</option>
					        <option value="Marketing">Marketing</option>
					        <option value="Operations">Operations</option>
					        <option value="Sales">Sales</option>

					    </select>

					    <label>Department *</label>

					</div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="text"
                               th:field="*{designation}"
                               class="form-control"
                               placeholder="Designation">

                        <label>
                            Designation *
                        </label>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="number"
                               step="0.01"
                               th:field="*{salary}"
                               class="form-control"
                               placeholder="Salary">

                        <label>
                            Salary *
                        </label>

                    </div>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-floating">

                        <input type="date"
                               th:field="*{joiningDate}"
                               class="form-control">

                        <label>
                            Joining Date *
                        </label>

                    </div>

                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-3">

                <button type="submit"
                        class="btn btn-save">

                    <i class="fas fa-save"></i>
                    Save Employee

                </button>

                <a th:href="@{/employee/list}"
                   class="btn btn-outline-secondary btn-back">

                    <i class="fas fa-arrow-left"></i>
                    Back

                </a>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
